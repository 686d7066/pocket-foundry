name: Link pull request issue

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: link-pr-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  link-issue:
    name: Add closing issue reference
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link issue from branch name
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types .github/workflows/link-pr-issue.ts
